services:
  postgres:
    image: postgres:16-alpine
    container_name: tgbot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tgbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tgbot123}
      POSTGRES_DB: ${POSTGRES_DB:-dentistry_bot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tgbot} -d ${POSTGRES_DB:-dentistry_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  studentbot:
    build:
      context: .
      dockerfile: Dockerfile.studentbot
    container_name: tgbot-student
    environment:
      - APP_STUDENT_BOT_TOKEN=${STUDENT_BOT_TOKEN}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dentistry_bot}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-tgbot}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-tgbot123}
      - APP_MATERIALS_PATH=/app/storage/materials
      - DB_MAX_CONNS=${DB_MAX_CONNS:-50}
      - DB_MIN_CONNS=${DB_MIN_CONNS:-10}
    volumes:
      - ./storage/materials:/app/storage/materials
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  adminweb:
    build:
      context: .
      dockerfile: Dockerfile.adminweb
    container_name: tgbot-adminweb
    ports:
      - "8080:8080"
    environment:
      - APP_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - STUDENT_BOT_TOKEN=${STUDENT_BOT_TOKEN}
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dentistry_bot}
      - DB_USER=${POSTGRES_USER:-tgbot}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-tgbot123}
      - APP_MATERIALS_PATH=/app/storage/materials
      - APP_GRADING_API_URL=${GRADING_API_URL:-https://api.openai.com/v1}
      - APP_GRADING_API_KEY=${GRADING_API_KEY:-}
      - APP_GRADING_MODEL=${GRADING_MODEL:-gpt-4o}
      - DB_MAX_CONNS=${DB_MAX_CONNS:-20}
      - DB_MIN_CONNS=${DB_MIN_CONNS:-5}
    volumes:
      - ./storage/materials:/app/storage/materials
      - ./configs:/app/configs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
