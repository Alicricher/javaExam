spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/dentistry_bot}
spring.datasource.username=${DB_USER:tgbot}
spring.datasource.password=${DB_PASSWORD:tgbot123}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_CONNS:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_CONNS:5}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.materials-path=${APP_MATERIALS_PATH:./storage/materials}
app.student-bot-token=${STUDENT_BOT_TOKEN:}
app.admin-password=${APP_ADMIN_PASSWORD:admin123}
app.grading.api-url=${APP_GRADING_API_URL:https://api.openai.com/v1}
app.grading.api-key=${APP_GRADING_API_KEY:}
app.grading.model=${APP_GRADING_MODEL:gpt-5.6-terra}
app.grading.prompt-file=configs/grading_prompt.txt
app.grading.lesson-prompts-dir=configs/grading
app.grading.vector-store-foreign=${APP_GRADING_VECTOR_STORE_FOREIGN:}
app.grading.vector-store-local=${APP_GRADING_VECTOR_STORE_LOCAL:}
server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
logging.level.com.dentistrybot=INFO
