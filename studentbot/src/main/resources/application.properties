app.student-bot-token=${STUDENT_BOT_TOKEN:}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/dentistry_bot}
spring.datasource.username=${DB_USER:tgbot}
spring.datasource.password=${DB_PASSWORD:tgbot123}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_CONNS:50}
spring.datasource.hikari.minimum-idle=${DB_MIN_CONNS:10}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.materials-path=${MATERIALS_PATH:./storage/materials}
app.dispatcher.workers=64
app.dispatcher.queue-size=4096
app.dispatcher.user-ttl-ms=300000
logging.level.com.dentistrybot=INFO
